kind: compose
metadata:
  name: Greenbone Community Edition
  description: |
    An **open-source vulnerability scanning** platform (formerly OpenVAS). Provides
    comprehensive network vulnerability testing, security auditing, and compliance
    checking for IT infrastructure.

    ## Prerequisites

    - :warning: Greenbone requires significant system resources. Minimum **4GB RAM** recommended.
    - :info: Initial NVT (Network Vulnerability Tests) sync takes 30+ minutes on first start.
    - :info: Default admin credentials are set via `GVMD_ADMIN_PASSWORD` environment variable.
    - :info: Web UI is accessible via GSAD on port 9392.

    ## Resources

    - **Project**: https://www.greenbone.net/en/community-edition/
    - **Documentation**: https://greenbone.github.io/docs/latest/
    - **GitHub**: https://github.com/greenbone
  version: 23.11.0
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: greenbone
      container_name:
        default: greenbone
      container_hostname:
        default: greenbone
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  greenbone:
    title: Greenbone Settings
    vars:
      gvmd_admin_password:
        type: str
        description: GVM administrator password
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_http:
        description: GSAD web UI port
        type: int
        default: 9392
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: greenbone
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: greenbone_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    description: Configure Docker Swarm deployment
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
