kind: compose
metadata:
  name: Nexus Repository Manager
  description: |
    A **universal repository manager** by Sonatype for managing binaries and build artifacts.
    Supports Maven, npm, PyPI, Docker, NuGet, Helm, and many more formats.

    ## Prerequisites

    - :info: Nexus stores all data in `/nexus-data`. Ensure sufficient disk space for artifacts.
    - :info: Default admin password is generated on first startup. Check the logs or
      the file `admin.password` inside the data volume.
    - :info: Nexus requires at least 4GB of RAM for stable operation.

    ## Resources

    - **Project**: https://www.sonatype.com/products/sonatype-nexus-oss
    - **Documentation**: https://help.sonatype.com/en/sonatype-nexus-repository.html
    - **Docker Hub**: https://hub.docker.com/r/sonatype/nexus3
  version: 3.78.0
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: nexus
      container_name:
        default: nexus
      container_hostname:
        default: nexus
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  ports:
    vars:
      ports_http:
        description: Nexus web UI port
        type: int
        default: 8081
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_docker_registry:
        description: Docker registry port (if Docker hosted repo is configured)
        type: int
        default: 8082
        needs: network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: nexus
      traefik_docker_host:
        type: hostname
        description: Hostname for Docker registry in Traefik
        default: ''
        needs: traefik_enabled
        extra: Leave empty to skip Docker registry routing
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/nexus
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/nexus
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: nexus_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    description: Configure Docker Swarm deployment
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
        extra: Constrains service to run on specific node by hostname
