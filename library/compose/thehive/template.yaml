kind: compose
metadata:
  name: TheHive
  description: |
    A **security incident response platform** designed for SOCs, CSIRTs, and CERTs.
    Provides case management, alert triage, observable analysis, and integrates with
    MISP and Cortex for threat intelligence enrichment.

    ## Prerequisites

    - :warning: TheHive 5 requires **Elasticsearch 7.x** (not 8.x) as the storage backend.
    - :info: Elasticsearch requires `vm.max_map_count=262144` on the Docker host.
      Set via: `sysctl -w vm.max_map_count=262144`
    - :info: Application secret is auto-generated and stored in the `.env` file.

    ## Resources

    - **Project**: https://thehive-project.org/
    - **Documentation**: https://docs.strangebee.com/
    - **GitHub**: https://github.com/TheHive-Project/TheHive
  version: 5.5.1
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: thehive
      container_name:
        default: thehive
      container_hostname:
        default: thehive
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  thehive:
    title: TheHive Settings
    vars:
      thehive_secret:
        type: str
        description: TheHive application secret key
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_http:
        description: TheHive web UI port
        type: int
        default: 9000
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: thehive
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: thehive_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    description: Configure Docker Swarm deployment
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
