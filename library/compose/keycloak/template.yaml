kind: compose
metadata:
  name: Keycloak
  description: |
    An **identity and access management** (IAM) platform providing single sign-on (SSO),
    identity brokering, social login, user federation, and fine-grained authorization
    services.

    ## Prerequisites

    - :info: Default admin credentials are configured via environment variables.
    - :info: Supports PostgreSQL (recommended) or embedded H2 database for development.
    - :info: Runs in development mode by default. Use `--optimized` for production.
    - :warning: Enable HTTPS (via Traefik or `--https-*` flags) for production deployments.

    ## Resources

    - **Project**: https://www.keycloak.org/
    - **Documentation**: https://www.keycloak.org/documentation
    - **GitHub**: https://github.com/keycloak/keycloak
  version: 26.2.0
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - database
  - security
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: keycloak
      container_name:
        default: keycloak
      container_hostname:
        default: keycloak
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  keycloak:
    title: Keycloak Settings
    vars:
      admin_user:
        type: str
        description: Keycloak admin username
        default: admin
      admin_password:
        type: str
        description: Keycloak admin password
        sensitive: true
        autogenerated: true
  database:
    title: Database
    toggle: database_enabled
    vars:
      database_enabled:
        type: bool
        description: Use PostgreSQL database (recommended)
        default: true
        extra: Embedded H2 database is used if disabled
      database_external:
        type: bool
        description: Use external PostgreSQL (skip embedded container)
        default: false
        needs: database_enabled
      database_host:
        type: str
        description: PostgreSQL host
        default: keycloak-db
        needs: database_enabled
      database_port:
        type: int
        description: PostgreSQL port
        default: 5432
        needs: database_enabled
      database_name:
        type: str
        description: Database name
        default: keycloak
        needs: database_enabled
      database_user:
        type: str
        description: Database username
        default: keycloak
        needs: database_enabled
      database_password:
        type: str
        description: Database password
        sensitive: true
        needs: database_enabled
  ports:
    vars:
      ports_http:
        description: Keycloak web UI port
        type: int
        default: 8080
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: keycloak
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/keycloak
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/keycloak
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: keycloak_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    description: Configure Docker Swarm deployment
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
