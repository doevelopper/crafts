kind: compose
metadata:
  name: Draw.io
  description: |
    A **self-hosted diagramming application** that provides a full-featured editor for
    creating flowcharts, network diagrams, UML, and more — directly in the browser.

    ## Use Cases

    - :info: Network and infrastructure diagrams
    - :info: Flowcharts and process documentation
    - :info: UML and software architecture diagrams
    - :info: Integration with Confluence, Jira, and other tools

    ## Resources

    - **Project**: https://www.drawio.com/
    - **Documentation**: https://www.drawio.com/doc/
    - **GitHub**: https://github.com/jgraph/drawio
  version: 26.2.2
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: drawio
      container_name:
        default: drawio
      container_hostname:
        default: drawio
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  ports:
    vars:
      ports_http:
        description: External HTTP port
        type: int
        default: 8080
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: drawio
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: drawio_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    description: Configure Docker Swarm deployment
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
        extra: Constrains service to run on specific node by hostname
