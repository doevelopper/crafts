kind: compose
metadata:
  name: Wazuh
  description: |
    A **unified security platform** providing SIEM, XDR, and compliance capabilities.
    Combines host-based intrusion detection, log analysis, vulnerability detection,
    and regulatory compliance monitoring.

    ## Prerequisites

    - :warning: Wazuh requires significant resources: minimum 4GB RAM for the indexer alone.
    - :info: Consists of three components: Manager (agent coordination), Indexer (OpenSearch),
      and Dashboard (web UI).
    - :info: Default credentials are `admin` / `SecretPassword`. Change immediately.
    - :info: Requires `vm.max_map_count=262144` on Docker host:
      `sysctl -w vm.max_map_count=262144`

    ## Resources

    - **Project**: https://wazuh.com/
    - **Documentation**: https://documentation.wazuh.com/
    - **GitHub**: https://github.com/wazuh/wazuh-docker
  version: 4.11.2
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - siem
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: wazuh
      container_name:
        default: wazuh
      container_hostname:
        default: wazuh
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  wazuh:
    title: Wazuh Settings
    vars:
      indexer_password:
        type: str
        description: Wazuh Indexer admin password
        sensitive: true
        autogenerated: true
      api_user:
        type: str
        description: Wazuh API username
        default: wazuh-wui
      api_password:
        type: str
        description: Wazuh API password
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_http:
        description: Dashboard web UI port
        type: int
        default: 443
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_agent:
        description: Agent registration port
        type: int
        default: 1514
        needs: network_mode=bridge
      ports_syslog:
        description: Syslog collector port
        type: int
        default: 514
        needs: network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    vars:
      traefik_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        default: web
        required: true
      traefik_host:
        default: wazuh
      traefik_network:
        type: str
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
      traefik_tls_entrypoint:
        type: str
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        default: /srv/wazuh
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        default: /mnt/wazuh
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: wazuh_network
      network_external:
        type: bool
        default: false
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        needs: swarm_placement_mode=replicated
