kind: compose
metadata:
  name: Smallstep Step CA
  description: |
    A **private certificate authority** (CA) for secure automated certificate management
    using the ACME protocol. Provides TLS certificates for internal services without
    relying on public CAs.

    ## Prerequisites

    - :info: On first run, Step CA initializes with the configured CA name and DNS names.
    - :info: The ACME provisioner is automatically configured for certificate issuance.
    - :warning: Store the CA password securely. It is required for CA administration.

    ## Resources

    - **Project**: https://smallstep.com/certificates/
    - **Documentation**: https://smallstep.com/docs/step-ca/
    - **GitHub**: https://github.com/smallstep/certificates
    - **Docker Hub**: https://hub.docker.com/r/smallstep/step-ca
  version: 0.28.5
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: step-ca
      container_name:
        default: step-ca
      container_hostname:
        default: step-ca
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  step_ca:
    title: Step CA Settings
    vars:
      ca_name:
        type: str
        description: Name of the certificate authority
        default: Smallstep
      ca_dns:
        type: str
        description: DNS names for the CA (comma-separated)
        default: localhost
      ca_password:
        type: str
        description: CA admin password
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_http:
        description: ACME API port
        type: int
        default: 9000
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: step-ca
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/step-ca
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/step-ca
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: step-ca_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
