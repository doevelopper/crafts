kind: compose
metadata:
  name: OWASP ZAP
  description: |
    A **dynamic application security testing** (DAST) tool for finding vulnerabilities
    in web applications. Provides automated scanners, a web UI, and a powerful REST API
    for integration into CI/CD pipelines.

    ## Prerequisites

    - :warning: The ZAP API key is auto-generated and stored in the `.env` file.
    - :info: Access the ZAP web UI on port 8080 and the API on port 8090.

    ## Resources

    - **Project**: https://www.zaproxy.org/
    - **Documentation**: https://www.zaproxy.org/docs/
    - **GitHub**: https://github.com/zaproxy/zaproxy
  version: 2.16.1
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - security
  - dast
  - traefik
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: owasp-zap
      container_name:
        default: owasp-zap
      container_hostname:
        default: owasp-zap
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  zap:
    title: ZAP Settings
    vars:
      zap_api_key:
        type: str
        description: ZAP API key for authentication
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_ui:
        description: ZAP web UI port
        type: int
        default: 8080
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_api:
        description: ZAP API port
        type: int
        default: 8090
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: owasp-zap
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/owasp-zap
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/owasp-zap
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: owasp-zap_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
