kind: compose
metadata:
  name: DefectDojo
  description: |
    A **vulnerability management** and correlation platform. Aggregates findings from
    security scanners (SAST, DAST, SCA, container scans) into a unified view with
    deduplication, metrics, and JIRA integration.

    ## Prerequisites

    - :warning: Requires PostgreSQL and Redis for operation.
    - :info: Default credentials are `admin` / auto-generated on first run. Check logs.
    - :info: Supports import from 150+ scanner formats (SARIF, SonarQube, Trivy, ZAP, etc.)

    ## Resources

    - **Project**: https://www.defectdojo.com/
    - **Documentation**: https://documentation.defectdojo.com/
    - **GitHub**: https://github.com/DefectDojo/django-DefectDojo
  version: 2.44.2
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - database
  - security
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: defectdojo
      container_name:
        default: defectdojo
      container_hostname:
        default: defectdojo
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  security:
    title: Security
    vars:
      secret_key:
        type: str
        description: Django secret key
        sensitive: true
        autogenerated: true
      aes_key:
        type: str
        description: AES-256 encryption key for credentials
        sensitive: true
        autogenerated: true
  database:
    title: Database
    toggle: database_enabled
    vars:
      database_enabled:
        type: bool
        description: Use PostgreSQL database
        default: true
      database_external:
        type: bool
        description: Use external PostgreSQL
        default: false
        needs: database_enabled
      database_host:
        type: str
        default: defectdojo-db
        needs: database_enabled
      database_port:
        type: int
        default: 5432
        needs: database_enabled
      database_name:
        type: str
        default: defectdojo
        needs: database_enabled
      database_user:
        type: str
        default: defectdojo
        needs: database_enabled
      database_password:
        type: str
        sensitive: true
        needs: database_enabled
  ports:
    vars:
      ports_http:
        type: int
        default: 8080
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    vars:
      traefik_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        default: web
        required: true
      traefik_host:
        default: defectdojo
      traefik_network:
        type: str
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
      traefik_tls_entrypoint:
        type: str
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: defectdojo_network
      network_external:
        type: bool
        default: false
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        needs: swarm_placement_mode=replicated
