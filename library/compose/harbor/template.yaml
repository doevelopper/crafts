kind: compose
metadata:
  name: Harbor
  description: |
    A **cloud-native container registry** that stores, signs, and scans container images.
    Provides vulnerability scanning, RBAC, image replication, and audit logging.

    ## Prerequisites

    - :warning: Harbor requires its offline installer for full deployment. This template
      provides a simplified single-node setup using the core components.
    - :info: Uses the official Harbor installer approach. Download and extract the Harbor
      offline installer, then use this as a reference configuration.
    - :info: Default credentials are `admin` / configured password.

    ## Resources

    - **Project**: https://goharbor.io/
    - **Documentation**: https://goharbor.io/docs/
    - **GitHub**: https://github.com/goharbor/harbor
  version: 2.13.0
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - registry
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: harbor
      container_name:
        default: harbor
      container_hostname:
        default: harbor
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  harbor:
    title: Harbor Settings
    vars:
      harbor_admin_password:
        type: str
        description: Harbor admin password
        sensitive: true
        autogenerated: true
      harbor_external_url:
        type: url
        description: External URL for Harbor
        default: http://localhost
      harbor_secret_key:
        type: str
        description: Secret key for encryption (16 chars)
        sensitive: true
        autogenerated: true
  database:
    title: Database
    toggle: database_enabled
    vars:
      database_enabled:
        type: bool
        default: true
      database_external:
        type: bool
        default: false
        needs: database_enabled
      database_host:
        type: str
        default: harbor-db
        needs: database_enabled
      database_port:
        type: int
        default: 5432
        needs: database_enabled
      database_name:
        type: str
        default: harbor
        needs: database_enabled
      database_user:
        type: str
        default: harbor
        needs: database_enabled
      database_password:
        type: str
        sensitive: true
        needs: database_enabled
  ports:
    vars:
      ports_http:
        type: int
        default: 80
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_https:
        type: int
        default: 443
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    vars:
      traefik_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        default: web
        required: true
      traefik_host:
        default: harbor
      traefik_network:
        type: str
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
      traefik_tls_entrypoint:
        type: str
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        default: /srv/harbor
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        default: /mnt/harbor
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: harbor_network
      network_external:
        type: bool
        default: false
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        needs: swarm_placement_mode=replicated
