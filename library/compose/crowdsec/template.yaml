kind: compose
metadata:
  name: CrowdSec
  description: |
    A **collaborative intrusion prevention system** (IPS) that analyzes visitor behavior
    and provides an adapted response to threats. Uses crowd-sourced threat intelligence
    to protect services.

    ## Prerequisites

    - :info: CrowdSec uses collections to define detection scenarios and parsers.
    - :info: The bouncer key is used to authenticate Traefik or other bouncers with the CrowdSec API.
    - :warning: Register at https://app.crowdsec.net/ for the CrowdSec Console and threat sharing.

    ## Resources

    - **Project**: https://www.crowdsec.net/
    - **Documentation**: https://docs.crowdsec.net/
    - **GitHub**: https://github.com/crowdsecurity/crowdsec
    - **Docker Hub**: https://hub.docker.com/r/crowdsecurity/crowdsec
  version: 1.6.8
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - traefik
  - security
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: crowdsec
      container_name:
        default: crowdsec
      container_hostname:
        default: crowdsec
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  crowdsec:
    title: CrowdSec Settings
    vars:
      bouncer_key:
        type: str
        description: Bouncer API key for authenticating bouncers
        sensitive: true
        autogenerated: true
      collection:
        type: str
        description: CrowdSec collection to install
        default: crowdsecurity/linux
  ports:
    vars:
      ports_http:
        description: CrowdSec API port
        type: int
        default: 8080
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_metrics:
        description: CrowdSec metrics port
        type: int
        default: 6060
        needs: network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: crowdsec
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/crowdsec
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/crowdsec
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: crowdsec_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
