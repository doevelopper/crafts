kind: compose
metadata:
  name: MinIO
  description: |
    A **high-performance, S3-compatible object storage** solution. Provides a web console
    for management and a fully compatible S3 API for application integration.

    ## Prerequisites

    - :warning: Root credentials are auto-generated and stored in the `.env` file.
    - :info: Access the MinIO Console on port 9001 and the S3 API on port 9000.

    ## Resources

    - **Project**: https://min.io/
    - **Documentation**: https://min.io/docs/minio/container/index.html
    - **GitHub**: https://github.com/minio/minio
  version: RELEASE.2025-02-18T16-25-55Z
  author: Christian Lempa
  date: '2026-02-28'
  tags:
  - storage
  - s3
  - traefik
  - swarm
  draft: true
schema: '1.2'
spec:
  general:
    vars:
      service_name:
        default: minio
      container_name:
        default: minio
      container_hostname:
        default: minio
      restart_policy:
        type: enum
        options:
        - unless-stopped
        - always
        - on-failure
        - 'no'
        default: unless-stopped
        required: true
  minio:
    title: MinIO Settings
    vars:
      root_user:
        type: str
        description: MinIO root username
        default: minioadmin
      root_password:
        type: str
        description: MinIO root password
        sensitive: true
        autogenerated: true
  ports:
    vars:
      ports_api:
        description: MinIO S3 API port
        type: int
        default: 9000
        needs:
        - traefik_enabled=false
        - network_mode=bridge
      ports_console:
        description: MinIO Console port
        type: int
        default: 9001
        needs:
        - traefik_enabled=false
        - network_mode=bridge
  traefik:
    toggle: traefik_enabled
    title: Traefik
    description: Configure Traefik reverse proxy integration
    vars:
      traefik_enabled:
        type: bool
        default: false
        description: Enable Traefik integration
        needs: network_mode=bridge
      traefik_entrypoint:
        type: str
        description: The Traefik entrypoint
        default: web
        required: true
      traefik_host:
        default: minio
      traefik_network:
        type: str
        description: Traefik network name
        default: traefik
        required: true
        needs: traefik_enabled
      traefik_network_external:
        type: bool
        description: Use external Traefik network
        default: true
        needs: traefik_enabled
      traefik_domain:
        type: str
        default: home.arpa
        required: true
  traefik_tls:
    toggle: traefik_tls_enabled
    title: Traefik TLS
    description: Configure Traefik TLS/SSL certificates
    needs: traefik
    vars:
      traefik_tls_enabled:
        type: bool
        default: false
        description: Enable Traefik TLS
      traefik_tls_entrypoint:
        type: str
        description: The Traefik TLS entrypoint
        default: websecure
        required: true
      traefik_tls_certresolver:
        type: str
        default: cloudflare
        required: true
  volume:
    title: Volume Storage
    vars:
      volume_mode:
        type: enum
        description: Volume storage mode
        options:
        - local
        - mount
        - nfs
        default: local
      volume_mount_path:
        type: str
        description: Host path for bind mount
        default: /srv/minio
        needs: volume_mode=mount
      volume_nfs_server:
        type: str
        description: NFS server address
        default: ''
        needs: volume_mode=nfs
      volume_nfs_path:
        type: str
        description: NFS export path
        default: /mnt/minio
        needs: volume_mode=nfs
      volume_nfs_options:
        type: str
        description: NFS mount options
        default: rw,nolock,soft
        needs: volume_mode=nfs
  network:
    vars:
      network_mode:
        type: enum
        options:
        - bridge
        - host
        - macvlan
        default: bridge
      network_name:
        default: minio_network
      network_external:
        type: bool
        default: false
        description: Whether the network is external
  swarm:
    toggle: swarm_enabled
    title: Docker Swarm
    vars:
      swarm_enabled:
        type: bool
        default: false
        description: Enable Docker Swarm mode
        needs: network_mode=bridge
      swarm_placement_mode:
        type: enum
        options:
        - replicated
        - global
        default: replicated
        required: true
      swarm_replicas:
        type: int
        default: 1
        description: Number of replicas
        needs: swarm_placement_mode=replicated
        required: true
      swarm_placement_host:
        type: str
        default: ''
        description: Target hostname for placement constraint
        needs: swarm_placement_mode=replicated
